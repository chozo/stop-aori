<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <!-- 告知動画のタイトル: 赤い丸の「STOP!」と黄色の「あおり運転」（ゲームのタイトルと同じ見た目） -->
  <g transform="translate(150 150) rotate(-12)">
    <circle r="128" fill="#d7141a" stroke="#1b1033" stroke-width="10"/>
    <circle r="110" fill="none" stroke="#fff" stroke-width="13"/>
    <text y="21" text-anchor="middle" textLength="168" lengthAdjust="spacingAndGlyphs" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
      font-weight="900" font-size="58" fill="#fff">STOP!</text>
  </g>
  <g font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-weight="900"
    font-size="118" text-anchor="middle" paint-order="stroke fill" stroke-linejoin="round">
    <text x="458" y="138" fill="#ffd84a" stroke="#1b1033" stroke-width="22">あおり</text>
    <text x="458" y="262" fill="#ffd84a" stroke="#1b1033" stroke-width="22">運転</text>
  </g>
</svg>
