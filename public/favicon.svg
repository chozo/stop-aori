<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 赤い丸に、少し傾けた「STOP!」（タイトルのマークと同じ） -->
  <circle cx="32" cy="32" r="31" fill="#d7141a"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#fff" stroke-width="3.5"/>
  <!-- 大文字の高さ（約0.72em）の半分だけ下に文字の下端を置き、丸の中心にそろえる。
       textLength が効かないブラウザでも縁にかからないよう、元の幅（約3.1em）が textLength とほぼ同じになる大きさにする -->
  <g transform="rotate(-12 32 32)">
    <text x="32" y="36.3" text-anchor="middle"
      font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="11.5"
      textLength="36" lengthAdjust="spacingAndGlyphs" fill="#fff">STOP!</text>
  </g>
</svg>
